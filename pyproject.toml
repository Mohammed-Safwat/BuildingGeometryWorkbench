
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "building-geometry-workbench"
version = "0.1.0"
description = "A desktop workbench for building geometry generation, visualization, and validation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "shapely>=2.0",
    "scikit-spatial>=8.1",
    "matplotlib>=3.8",
    "PySide6>=6.7",
    "pyvista>=0.44",
    "pyvistaqt>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[project.scripts]
building-geometry-workbench = "buildingpipeline.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]